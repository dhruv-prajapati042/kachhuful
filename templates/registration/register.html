{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="surface p-4 shadow-sm border-0 rounded-3">
      <div class="text-center mb-4">
        <span class="badge bg-success text-white font-monospace text-uppercase mb-2 px-3 py-1">User Registration</span>
        <h1 class="h3 fw-bold mb-1">Create Account</h1>
        <p class="text-secondary small mb-0">Register your Name & Email to join Kachhu Ful tables easily</p>
      </div>

      <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-bold" for="reg-name">Full Name</label>
          <input class="form-control" id="reg-name" name="name" placeholder="e.g. Dhruv Prajapati" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold" for="reg-email">Email Address</label>
          <input class="form-control" id="reg-email" name="email" type="email" placeholder="e.g. dhruv@example.com" required>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold" for="reg-password">Password</label>
          <input class="form-control" id="reg-password" name="password" type="password" placeholder="Create a password" required>
        </div>

        <button class="btn btn-success w-100 fw-bold py-2" type="submit">✨ Register Account</button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-secondary small">Already have an account?</span>
        <a href="{% url 'login' %}" class="fw-bold text-success text-decoration-none ms-1">Log in here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
